[project]
name = "snakes-ladders"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pygame>=2,<3"]

[project.optional-dependencies]
dev = ["pytest", "coverage", "pytest-timeout", "psutil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["real_animation: run with the real token animation timing"]
